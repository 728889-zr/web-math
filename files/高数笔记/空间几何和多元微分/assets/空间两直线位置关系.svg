<text x="40.00" y="1053.00" font-size="21" fill="#1d2d45" font-weight="600" text-anchor="start">下排的方向完全相同：s₁ = (1, 0, 0)，s₂ = (0, 1, 0)，n = (0, 0, 1)。紫色虚线 QP₂ 是法向分量。</text>
